<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>セツナとトワのはなうた</title>
<meta name="description" content="刹那の気分を、永遠のはなうたに。白猫セツナと黒猫トワが、その時の気分で即興の鼻歌を歌ってくれるWebアプリ。">
<meta name="theme-color" content="#F5F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15121C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="はなうた">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta property="og:title" content="セツナとトワのはなうた">
<meta property="og:description" content="刹那の気分を、永遠のはなうたに。">
<meta property="og:image" content="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* standalone page reset (artifact host used to provide these) */
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
.install{display:flex;gap:10px;align-items:center;background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:10px 12px;font-size:.82rem;color:var(--fg)}
.install p{margin:0;flex:1;min-width:0}
.install button{font-family:var(--body);font-size:.8rem;border:none;background:none;color:var(--muted);cursor:pointer;padding:6px}
.credit{font-size:.72rem;color:var(--muted);text-align:center;margin:0;line-height:1.7}

/* Layout: a stage that turns day (Setsuna) or night (Towa) depending on who sings; title + catch copy above, mood picker and controls below */
:root{
  --bg:#F5F2F7; --surface:#FFFFFF; --fg:#241B33; --muted:#6F6680; --line:#E2DCE8; --ink:#1E1A24;
  --mood:#EE8A1B;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN",sans-serif;
  --brush:"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15121C; --surface:#201B2A; --fg:#F1ECF6; --muted:#A79EB8; --line:#342D41; --ink:#0B090E; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15121C; --surface:#201B2A; --fg:#F1ECF6; --muted:#A79EB8; --line:#342D41; --ink:#0B090E; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:540px;margin:0 auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:16px}

header{display:flex;flex-direction:column;gap:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.45rem,6.4vw,1.9rem);line-height:1.2;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 .s{color:#D9771A}
h1 .t{color:#5B4E8C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1 .t{color:#A99BE0}}
:root[data-theme="dark"] h1 .t{color:#A99BE0}
.catch{font-family:var(--brush);font-size:1.12rem;margin:0;color:var(--muted);letter-spacing:.06em}
.meta{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;white-space:nowrap}

/* stage: its own world, independent of page theme */
.stage{position:relative;height:440px;max-height:74vh;border-radius:28px;overflow:hidden;isolation:isolate;
  border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.sky{position:absolute;inset:0;transition:opacity 1.2s ease}
.sky.day{background:
  radial-gradient(circle at 18% 22%,rgba(255,255,255,.9) 0 38px,rgba(255,230,160,.55) 39px 70px,transparent 71px),
  linear-gradient(#FFE4B8 0%,#FFD3A1 55%,#F7B983 100%)}
.sky.night{background:
  radial-gradient(1.5px 1.5px at 12% 18%,#fff 99%,transparent),radial-gradient(1px 1px at 28% 40%,#fff 99%,transparent),
  radial-gradient(1.5px 1.5px at 46% 12%,#fff 99%,transparent),radial-gradient(1px 1px at 63% 30%,#fff 99%,transparent),
  radial-gradient(2px 2px at 85% 16%,#fff 99%,transparent),radial-gradient(1px 1px at 92% 42%,#fff 99%,transparent),
  radial-gradient(1px 1px at 6% 48%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 74% 52%,#fff 99%,transparent),
  radial-gradient(circle at 80% 20%,#FFF6C8 0 26px,rgba(255,240,170,.18) 27px 60px,transparent 61px),
  linear-gradient(#1C1638 0%,#2C2256 60%,#43357A 100%);opacity:0}
.stage.is-night .sky.night{opacity:1}
.floor{position:absolute;left:-10%;right:-10%;bottom:-60px;height:120px;border-radius:50%;
  background:rgba(120,70,40,.18);transition:background 1.2s}
.stage.is-night .floor{background:rgba(10,6,30,.35)}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

.cat{position:absolute;bottom:26px;width:44%;height:66%;z-index:2;display:flex;align-items:flex-end;justify-content:center;
  transition:transform .6s cubic-bezier(.3,1.3,.5,1),filter .6s,opacity .6s;transform-origin:50% 100%}
.cat.setsuna{left:3%}
.cat.towa{right:3%}
.cat.rest{transform:scale(.84);filter:saturate(.7) brightness(.92);opacity:.88}
.cat.rest img{animation:breathe 4s ease-in-out infinite}
.cat img{display:block;max-width:100%;height:var(--h,100%);object-fit:contain;object-position:50% 100%;
  transform:scaleX(var(--f,1));transform-origin:50% 96%;transition:transform .16s cubic-bezier(.3,1.6,.5,1);user-select:none;-webkit-user-drag:none}
@keyframes breathe{0%,100%{transform:scaleX(var(--f,1)) scaleY(1)}50%{transform:scaleX(var(--f,1)) scaleY(1.015)}}
.shadow{position:absolute;bottom:20px;width:30%;height:14px;border-radius:50%;background:rgba(40,20,40,.22);z-index:1;transition:left .6s}
.shadow.s{left:10%}.shadow.t{right:10%}

.bubble{position:absolute;top:18px;z-index:4;text-align:center;white-space:nowrap;
  font-family:var(--display);font-size:clamp(1.3rem,6vw,1.75rem);color:#1E1A24;background:#fff;
  border:3px solid #1E1A24;border-radius:20px;padding:2px 16px 4px;box-shadow:4px 4px 0 var(--mood);
  transition:left .5s cubic-bezier(.3,1.3,.5,1),box-shadow .6s,transform .12s;left:25%;transform:translateX(-50%)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-13px;width:16px;height:16px;background:#fff;
  border-right:3px solid #1E1A24;border-bottom:3px solid #1E1A24;transform:translateX(-50%) rotate(45deg)}
.stage.towa-sings .bubble{left:75%}
.bubble.pop{transform:translateX(-50%) scale(1.08)}
.fx{position:absolute;inset:0;z-index:3;pointer-events:none}
.fx img,.fx span{position:absolute;animation:rise 2s ease-out forwards}
.fx span{font-family:var(--display);font-size:1.4rem;color:#fff;-webkit-text-stroke:1.2px #1E1A24}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-130px) scale(1.1) rotate(var(--rot))}}
.caption{position:absolute;left:0;right:0;bottom:4px;margin:0;text-align:center;font-size:.74rem;z-index:4;color:#7A5233;transition:color 1s}
.stage.is-night .caption{color:#C9BFF0}
.names{position:absolute;bottom:4px;z-index:4;font-family:var(--display);font-size:.7rem;letter-spacing:.12em;padding:0 8px;border-radius:999px}

.label{font-size:.78rem;color:var(--muted);letter-spacing:.08em;margin:0 0 8px;font-weight:500}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood{font-family:var(--body);padding:9px 6px 8px;border-radius:16px;border:2px solid var(--line);
  background:var(--surface);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .12s}
.mood b{font-family:var(--display);font-weight:400;font-size:.95rem}
.mood small{font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:4px}
.mood small img{width:12px;height:auto}
.mood:active{transform:scale(.97)}
.mood[aria-pressed="true"]{border-color:var(--ink);background:var(--c);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.mood[aria-pressed="true"] small{color:rgba(255,255,255,.9)}
button:focus-visible,input:focus-visible{outline:3px solid var(--mood);outline-offset:2px}

.controls{display:flex;gap:10px;align-items:stretch}
.play{flex:1;font-family:var(--display);font-size:1.15rem;padding:13px;border-radius:999px;border:3px solid var(--ink);
  background:var(--mood);color:#fff;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:background .6s,transform .08s,box-shadow .08s}
.play:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.again{font-family:var(--body);font-weight:700;font-size:.92rem;padding:12px 16px;border-radius:999px;border:2px solid var(--line);
  background:var(--surface);color:var(--fg);cursor:pointer}
.again:disabled{opacity:.45;cursor:default}
.opts{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.row label{font-size:.9rem}
.row input[type=range]{flex:1;max-width:220px;accent-color:var(--mood)}
.row output{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;min-width:3.5em;text-align:right}
.switch{accent-color:var(--mood);width:20px;height:20px}
.note{font-size:.78rem;color:var(--muted);margin:0;text-align:center}
@media (prefers-reduced-motion:reduce){.sky,.cat,.cat img{transition:none}.cat.rest img{animation:none}.fx{display:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="install" id="install" hidden>
    <p>Safariの共有ボタン → 「ホーム画面に追加」で、アプリとして使えます。</p>
    <button type="button" id="installClose" aria-label="閉じる">閉じる</button>
  </div>
  <header>
    <div class="top">
      <h1><span class="s">セツナ</span>と<span class="t">トワ</span>のはなうた</h1>
      <div class="meta" id="meta">キー: — · ♩=—</div>
    </div>
    <p class="catch">刹那の気分を、永遠のはなうたに。</p>
  </header>

  <section class="stage" id="stage" aria-label="セツナとトワのステージ">
    <div class="sky day"></div>
    <div class="sky night"></div>
    <div class="floor"></div>
    <canvas id="cv" aria-hidden="true"></canvas>
    <div class="shadow s"></div><div class="shadow t"></div>
    <div class="cat setsuna" id="catS"><img id="imgS" alt="白猫のセツナ"></div>
    <div class="cat towa" id="catT"><img id="imgT" alt="黒猫のトワ"></div>
    <div class="bubble" id="hum">ふ〜ん</div>
    <div class="fx" id="fx"></div>
    <p class="caption" id="cap">気分をえらんで「歌う」を押してね</p>
  </section>

  <div>
    <p class="label">いまの気分</p>
    <div class="moods" id="moods"></div>
  </div>

  <div class="controls">
    <button class="play" id="play">▶ 歌う</button>
    <button class="again" id="again" disabled>別のメロディ</button>
  </div>

  <div class="opts">
    <div class="row"><label for="tempo">テンポ</label><input type="range" id="tempo" min="-30" max="30" value="0"><output id="tempoOut">ふつう</output></div>
    <div class="row"><label for="pitch">声の高さ</label><input type="range" id="pitch" min="-7" max="7" value="0"><output id="pitchOut">±0</output></div>
    <div class="row"><label for="backing">ギター伴奏</label><input type="checkbox" class="switch" id="backing" checked></div>
  </div>
  <p class="note">明るい気分はセツナ、静かな気分はトワが歌います。メロディは毎回その場で作曲。</p>
  <p class="credit">キャラクター：CryptoNinja Partners（CNP）のセツナ・トワ<br>CNPホルダーによる二次創作アプリです。CNP公式とは関係ありません。<br>v1.0.1</p>
</div>

    prog:[0,1,0,1],keys:[53,55,57],bright:620,syl:['ん〜','む〜','ふにゃ〜'],strum:[0]},
  natsukashi:{name:'なつかしい',who:'t',c:'#93275F',full:DORIAN,mel:[0,2,3,5,7,9,10],tempo:92,swing:.25,rh:'calm',rest:.1,
    prog:[0,3,0,6],keys:[55,57,60],bright:1000,syl:['ふ','ふ〜ん','ん','にゃふ'],strum:[0,1.5,2,3]}
};
const NOTE=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
// relative display heights so every pose stands at the same scale
const POSE_H={s01:1,s03:.86,s05:.9,s06:.97,t01:1,t03:.86,t05:.87,t06:.86};
// mirror poses so Setsuna (left) faces right and Towa (right) faces left
const FLIP={s06:1,t01:1,t03:1,t05:1};

let moodKey='gokigen', ctx=null, nodes=null, playing=false, timer=null, events=[], phraseNo=0, motif=null, song=null;
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];

function setPose(who,p){
  const img=who==='s'?$('imgS'):$('imgT'),key=who+p;
  if(img.dataset.p===key)return;
  img.dataset.p=key;img.src=IMG[(who==='s'?'setsuna_':'towa_')+p];img.style.setProperty('--h',(POSE_H[key]*100)+'%');img.style.setProperty('--f',FLIP[key]?-1:1);
}
setPose('s','01');setPose('t','01');

// ---------- mood chips ----------
for(const [k,m] of Object.entries(MOODS)){
  const b=document.createElement('button');b.className='mood';b.style.setProperty('--c',m.c);
  const who=m.who==='s'?'セツナ':'トワ',ico=m.who==='s'?IMG.setsuna_paw:IMG.towa_paw;
  b.innerHTML=`<b>${m.name}</b><small><img src="${ico}" alt="">${who}</small>`;b.setAttribute('aria-pressed',k===moodKey);
  b.onclick=()=>{moodKey=k;document.querySelectorAll('.mood').forEach(x=>x.setAttribute('aria-pressed',x===b));
    applyMood();updateMeta();if(playing)restart();};
  $('moods').appendChild(b);
}
function applyMood(){
  const m=MOODS[moodKey];document.documentElement.style.setProperty('--mood',m.c);
  const st=$('stage');st.classList.toggle('is-night',m.who==='t');st.classList.toggle('towa-sings',m.who==='t');
  $('catS').classList.toggle('rest',m.who!=='s');$('catT').classList.toggle('rest',m.who!=='t');
  $('hum').textContent=m.who==='s'?'るん♪':'ふ〜ん';
}
applyMood();

const tempoVal=()=>MOODS[moodKey].tempo*(1+$('tempo').value/100);
$('tempo').oninput=()=>{const v=+$('tempo').value;$('tempoOut').textContent=v===0?'ふつう':(v>0?'+':'')+v+'%';updateMeta()};
$('pitch').oninput=()=>{const v=+$('pitch').value;$('pitchOut').textContent=(v>0?'+':v<0?'':'±')+v;if(playing)restart()};

// ---------- song setup ----------
function newSong(){
  const m=MOODS[moodKey];
  const root=rnd(m.keys)+ +$('pitch').value;
  const lo=root-3, hi=root+(m.rh==='slow'?10:14);
  const pool=[];for(let n=lo;n<=hi;n++){if(m.mel.includes(((n-root)%12+12)%12))pool.push(n)}
  song={m,root,pool,prog:m.prog.slice()};motif=null;phraseNo=0;updateMeta();
}
function updateMeta(){if(!song){$('meta').textContent='キー: — · ♩='+Math.round(tempoVal());return}
  const minorish=song.m.full===MINOR||song.m.full===DORIAN;
  $('meta').textContent=`キー: ${NOTE[((song.root%12)+12)%12]}${minorish?'マイナー':'メジャー'} · ♩=${Math.round(tempoVal())}`}
function chordPCs(deg){const f=song.m.full;return[0,2,4].map(i=>(song.root+f[(deg+i)%7]+(deg+i>=7?12:0))%12)}
function nearestChordTone(idx,deg){
  const pcs=chordPCs(deg);let best=idx,bd=99;
  song.pool.forEach((n,i)=>{if(pcs.includes(((n%12)+12)%12)&&Math.abs(i-idx)<bd){bd=Math.abs(i-idx);best=i}});return best}
function step(){const r=Math.random();const s=r<.12?0:r<.66?1:r<.9?2:3;return Math.random()<.5?-s:s}

// a phrase = 4 bars; odd phrases answer the previous one (same opening motif, different ending)
function makePhrase(){
  const m=song.m,P=song.pool,bars=[];const answer=phraseNo%2===1&&motif;
  let idx=motif?motif.startIdx:Math.floor(P.length*0.35);
  for(let b=0;b<4;b++){
    const deg=song.prog[b];let durs;
    if(b===3)durs=rnd([[1,3],[2,2],[.5,.5,3],[1,1,2]]);
    else if(answer&&b<2)durs=motif.rhythm[b];
    else durs=rnd(R[m.rh]);
    const notes=[];let pos=0;
    durs.forEach((d,i)=>{
      if(answer&&b<2&&motif.pitches[b][i]!=null){idx=motif.pitches[b][i];}
      else{idx+=step();if(idx<0)idx=1;if(idx>=P.length)idx=P.length-2;
        if(pos===0||d>=2)idx=nearestChordTone(idx,deg);}
      if(b===3&&i===durs.length-1){ // cadence: land on the tonic on answers, chord tone otherwise
        const target=answer?P.findIndex((n,j)=>j>=Math.floor(P.length*.15)&&((n-song.root)%12+12)%12===0):nearestChordTone(idx,deg);
        idx=target<0?idx:target;}
      const rest=i>0&&i<durs.length-1&&Math.random()<m.rest;
      notes.push({pos,dur:d,idx:rest?null:idx});pos+=d;
    });
    bars.push({deg,notes});
  }
  if(!answer){motif={rhythm:[bars[0].notes.map(n=>n.dur),bars[1].notes.map(n=>n.dur)],
    pitches:[bars[0].notes.map(n=>n.idx),bars[1].notes.map(n=>n.idx)],startIdx:bars[0].notes[0].idx??idx}}
  else motif=null;
  phraseNo++;return bars;
}

// ---------- audio ----------
function makeImpulse(sec){const len=ctx.sampleRate*sec,buf=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}return buf}
function setupAudio(){
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  const master=ctx.createGain();master.gain.value=.85;
  const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
  const verb=ctx.createConvolver();verb.buffer=makeImpulse(2.4);const wet=ctx.createGain();wet.gain.value=.28;
  verb.connect(wet);wet.connect(master);
  // voice: saw + soft square-ish second partial, through a closed-mouth "mm" filter
  const osc=ctx.createOscillator();osc.type='sawtooth';
  const osc2=ctx.createOscillator();osc2.type='triangle';
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=.9;lp.frequency.value=song.m.bright;
  const nasal=ctx.createBiquadFilter();nasal.type='peaking';nasal.frequency.value=280;nasal.Q.value=1.2;nasal.gain.value=7;
  const hi=ctx.createBiquadFilter();hi.type='peaking';hi.frequency.value=2600;hi.Q.value=2;hi.gain.value=-8;
  const o2g=ctx.createGain();o2g.gain.value=.6;
  const env=ctx.createGain();env.gain.value=0;
  osc.connect(lp);osc2.connect(o2g);o2g.connect(lp);lp.connect(nasal);nasal.connect(hi);hi.connect(env);
  env.connect(master);env.connect(verb);
  const lfo=ctx.createOscillator();lfo.frequency.value=5.4;const vib=ctx.createGain();vib.gain.value=0;
  lfo.connect(vib);vib.connect(osc.detune);vib.connect(osc2.detune);
  const bus=ctx.createGain();bus.gain.value=$('backing').checked?.55:0;bus.connect(master);bus.connect(verb);
  [osc,osc2,lfo].forEach(o=>o.start());
  nodes={master,osc,osc2,env,vib,verb,bus,lp};
}
const hz=m=>440*Math.pow(2,(m-69)/12);
$('backing').onchange=()=>{if(nodes)nodes.bus.gain.setTargetAtTime($('backing').checked?.55:0,ctx.currentTime,.1)};

function pluck(midi,t,vel,len){
  const o=ctx.createOscillator();o.type='triangle';o.frequency.value=hz(midi);
  const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(2400,t);f.frequency.exponentialRampToValueAtTime(500,t+len);
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+.008);g.gain.exponentialRampToValueAtTime(.0005,t+len);
  o.connect(f);f.connect(g);g.connect(nodes.bus);o.start(t);o.stop(t+len+.05);
}
function chordMidis(deg){const f=song.m.full,base=song.root-12;
  return[0,2,4].map(i=>base+f[(deg+i)%7]+(deg+i>=7?12:0))}

function schedulePhrase(t0){
  const bars=makePhrase(),beat=60/tempoVal(),sw=song.m.swing;
  const at=p=>{const f=p%1;return t0+(Math.floor(p)+(Math.abs(f-.5)<1e-6?.5+sw*.5:f))*beat};
  const flat=[];bars.forEach((bar,b)=>bar.notes.forEach(n=>flat.push({...n,abs:b*4+n.pos,bar:b})));
  const {osc,osc2,env,vib}=nodes;
  flat.forEach((n,i)=>{
    const t=at(n.abs),tEnd=at(n.abs+n.dur),next=flat[i+1];
    if(n.idx==null){env.gain.setTargetAtTime(0,t,.04);return}
    const midi=song.pool[n.idx],f=hz(midi);
    const glide=next&&next.idx!=null&&Math.random()<.45?.05:.018;
    osc.frequency.setTargetAtTime(f,t-.01,glide);osc2.frequency.setTargetAtTime(f*2,t-.01,glide);
    const vel=(n.pos===0?.34:.27)*(n.dur>=2?1.05:1);
    env.gain.setTargetAtTime(vel,t,.025);
    const dur=tEnd-t;
    vib.gain.setTargetAtTime(0,t,.05);if(dur>.45)vib.gain.setTargetAtTime(16,t+Math.min(.3,dur*.4),.15);
    // articulation: little dip between notes ("ふ・ふ"), or fade at phrase end
    const lastOfPhrase=i===flat.length-1;
    if(lastOfPhrase)env.gain.setTargetAtTime(0,tEnd-dur*.35,dur*.18);
    else if(!next||next.idx==null||Math.random()<.55)env.gain.setTargetAtTime(vel*.35,tEnd-.06,.02);
    let syl=rnd(song.m.syl);if(dur>1.2&&!syl.includes('〜'))syl=syl.replace(/ん?$/,'')+'〜ん';
    events.push({t,end:tEnd,midi,syl});
  });
  // backing guitar
  bars.forEach((bar,b)=>{const cm=chordMidis(bar.deg);
    pluck(cm[0]-12,at(b*4),.32,beat*3.2);
    song.m.strum.forEach((p,k)=>{cm.forEach((m,j)=>pluck(m+(j===0?12:0),at(b*4+p)+j*.012,k===0?.13:.08,beat*1.6))});
  });
  return at(16)+(phraseNo%2===0?beat:0); // breathe after the answer phrase
}

function loop(t0){
  if(!playing)return;
  const tNext=schedulePhrase(t0);
  timer=setTimeout(()=>loop(tNext),Math.max(0,(tNext-ctx.currentTime-.6)*1000));
}
async function start(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  newSong();setupAudio();await ctx.resume();
  playing=true;events=[];$('play').textContent='■ やめる';$('again').disabled=false;
  $('cap').textContent=`${song.m.who==='s'?'セツナ':'トワ'}が${song.m.name}気分で歌ってます`;
  loop(ctx.currentTime+.15);
}
function stop(){
  playing=false;clearTimeout(timer);
  if(nodes){const n=nodes,t=ctx.currentTime;
    n.env.gain.cancelScheduledValues(t);n.env.gain.setTargetAtTime(0,t,.05);
    n.bus.gain.cancelScheduledValues(t);n.bus.gain.setTargetAtTime(0,t,.05);
    setTimeout(()=>{try{n.osc.stop();n.osc2.stop();n.master.disconnect()}catch(e){}},500);nodes=null;}
  $('play').textContent='▶ 歌う';$('again').disabled=true;setPose('s','01');setPose('t','01');$('imgS').style.transform='';$('imgT').style.transform='';$('cap').textContent='気分をえらんで「歌う」を押してね';
}
function restart(){stop();start()}
$('play').onclick=()=>playing?stop():start();
$('again').onclick=restart;



// ---------- stage ----------
const cv=$('cv'),g=cv.getContext('2d'),fx=$('fx');let lastSyl=null,tilt=1;
function burst(who){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const r=fx.getBoundingClientRect(),cx=who==='s'?r.width*.25:r.width*.75;
  let el;
  const roll=Math.random();
  if(roll<.4){el=document.createElement('span');el.textContent=Math.random()<.5?'♪':'♫'}
  else{el=document.createElement('img');el.alt='';
    el.src=roll<.75?(who==='s'?IMG.setsuna_flame:IMG.towa_flame):(who==='s'?IMG.setsuna_paw:IMG.towa_paw);
    el.style.width=(roll<.75?16:24)+'px'}
  el.style.left=(cx+(Math.random()*60-30))+'px';el.style.top=(r.height*.34)+'px';
  el.style.setProperty('--dx',(Math.random()*80-40)+'px');el.style.setProperty('--rot',(Math.random()*40-20)+'deg');
  fx.appendChild(el);setTimeout(()=>el.remove(),2100);
}
function singPose(who,lift){
  if(who==='s')return lift>.72?'06':(Math.random()<.5?'03':'05');
  return lift>.75?(moodKey==='natsukashi'?'06':'05'):(Math.random()<.5?'01':'03');
}
function draw(){
  const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=w*dpr;cv.height=h*dpr}
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const who=MOODS[moodKey].who;
  if(ctx&&song&&playing){
    const now=ctx.currentTime,span=5,xNow=w*.5,px=xNow/span;
    const lo=song.pool[0]-1,hi=song.pool[song.pool.length-1]+1,y=m=>h*.62-(m-lo)/(hi-lo)*(h*.36);
    events=events.filter(e=>e.end>now-span-1);
    g.lineCap='round';g.strokeStyle=who==='s'?'#fff':'#FFE27A';g.lineWidth=8;
    for(const e of events){if(e.t>now+.05)continue;
      const x1=xNow-(now-e.t)*px,x2=xNow-(now-Math.min(e.end,now))*px;
      g.globalAlpha=e.end<now?.22:.5;
      g.beginPath();g.moveTo(x1,y(e.midi));g.lineTo(Math.max(x1+.5,x2),y(e.midi));g.stroke();}
    g.globalAlpha=1;
    const cur=events.find(e=>e.t<=now&&e.end>now);
    const img=who==='s'?$('imgS'):$('imgT');
    if(cur&&cur!==lastSyl){
      lastSyl=cur;const b=$('hum');b.textContent=cur.syl;b.classList.add('pop');setTimeout(()=>b.classList.remove('pop'),120);
      const lift=(cur.midi-lo)/(hi-lo);tilt=-tilt;
      setPose(who,singPose(who,lift));
      img.style.transform=`translateY(${-4-lift*14}px) rotate(${tilt*(2+lift*4)}deg) scaleX(var(--f,1))`;
      if(Math.random()<.7)burst(who);
    }else if(!cur&&lastSyl){lastSyl=null;img.style.transform='';}
  }
  requestAnimationFrame(draw);
}
newSong();song=null;updateMeta();draw();
</script>

<script>
// offline support
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
// "add to home screen" hint: iPhone/iPad Safari, not yet installed
(function(){
  const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  let dismissed=false;try{dismissed=localStorage.getItem('installHint')==='0'}catch(e){}
  const box=document.getElementById('install');
  if(ios&&!standalone&&!dismissed)box.hidden=false;
  document.getElementById('installClose').onclick=()=>{box.hidden=true;try{localStorage.setItem('installHint','0')}catch(e){}};
})();
</script>
</body>
